<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Yu Gothic",Meiryo,sans-serif;color:#3e2a1a;background:#f7edda}button{font:inherit;cursor:pointer;touch-action:manipulation}
header{height:7.5dvh;min-height:44px;background:#ead1a5;display:flex;align-items:center;justify-content:space-between;padding:0 1.5vw;border-bottom:3px solid #967146}h1{font-size:clamp(17px,2.3vw,30px);margin:0}header span{font-weight:bold;font-size:clamp(13px,1.4vw,19px)}
main{height:92.5dvh;display:grid;grid-template-columns:58% 42%;padding:7px;gap:8px;min-height:0}.panel{background:#fffdf7;border:2px solid #d7b88c;border-radius:12px;min-height:0;overflow:hidden}.menu{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:4px;padding:5px;height:100%}.menugroup{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}.groupname{font-size:clamp(11px,1.1vw,16px);font-weight:900;color:#24775b;padding-left:6px;line-height:1.3}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-height:0}.cards.sauces{grid-template-columns:repeat(3,minmax(0,1fr))}.item{border:2px solid #d6bd94;border-radius:8px;background:white;min-width:0;min-height:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.item:active{background:#ffe4ae;transform:scale(.98)}.item img{width:100%;height:calc(100% - 18px);object-fit:contain;min-height:0}.item b{font-size:clamp(10px,1.05vw,15px);line-height:16px;color:#156b4c}
.right{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:7px;min-height:0;padding-right:8px}.budget{padding:7px 12px}.budgetline{display:flex;align-items:center;justify-content:space-between;gap:5px}.budgetline strong{font-size:clamp(22px,2.8vw,36px)}.bar{height:14px;background:#e9e1d5;border-radius:10px;overflow:hidden}.fill{height:100%;background:#43a675;width:0;transition:width .2s}.over .fill{background:#e44949}.remaining{font-size:clamp(13px,1.4vw,19px);font-weight:900;color:#277755}.over .remaining{color:#c22}
.selection{display:flex;flex-direction:column;min-height:0}.selection h2{font-size:clamp(14px,1.5vw,21px);margin:0;padding:5px 10px;background:#f4e4c7}.selectionbox{margin:7px;flex:1;border:3px solid #a7d1c6;background:#fff;min-height:0;border-radius:7px;padding:7px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:5px;overflow:hidden}.selected{display:flex;align-items:center;gap:3px;border:1px solid #d9c2a2;border-radius:6px;padding:3px 5px;background:#fff9e8;font-size:clamp(10px,1vw,14px);font-weight:bold}.selected img{width:clamp(28px,3.2vw,46px);height:clamp(28px,3.2vw,46px);object-fit:cover;border-radius:3px}.selected button{background:#f5d4d4;border:0;border-radius:6px;font-weight:bold;padding:4px 6px}.empty{color:#9a8b78;font-size:18px;margin:auto}.notice{font-size:clamp(12px,1.25vw,18px);font-weight:bold;padding:0 10px;color:#236e53}.notice.warn{color:#c22}.actions{display:flex;gap:5px;padding:0 0 4px}.actions button{border:0;border-radius:10px;background:#e8d8bd;font-weight:900;padding:10px 5px;flex:1}.actions .finish{background:#f0a64c;flex:1.5;font-size:clamp(16px,1.7vw,22px)}
dialog{border:0;border-radius:18px;max-height:88dvh;width:min(650px,90vw);padding:20px;text-align:center}dialog::backdrop{background:#0009}.summary{max-height:48dvh;overflow:auto;text-align:left}.summary p{margin:5px 0;border-bottom:1px dashed #ddd}.close{padding:12px 25px;border:0;border-radius:10px;background:#267b61;color:white;font-weight:bold}

:root{--deep:#145e50;--teal:#1c8177;--sand:#f5d8a2;--coral:#ed7d66}
body{background:repeating-linear-gradient(0deg,#fff9e8,#fff9e8 18px,#fff5dc 18px,#fff5dc 36px);color:#29483f}
header{background:linear-gradient(105deg,#0b625a,#1e9380 55%,#0b625a);color:white;border-bottom:5px solid #e7b56c;box-shadow:0 3px 12px #0002}
header:before{content:"🌺 🌴";font-size:clamp(18px,2.5vw,32px);margin-right:8px}
header span{color:#ffebae}
.panel{background:#fffcf2;border:2px solid #d3b07d;box-shadow:0 3px 8px #6c4e231a}
.groupname{background:linear-gradient(90deg,#17786b,#49a48b);color:white;border-radius:5px;padding:2px 9px;margin:1px 2px;font-size:clamp(11px,1.2vw,17px)}
.item{border:1.5px solid #d2b287;background:#fff;border-radius:9px;box-shadow:0 2px 4px #0001;padding:3px}
.item img{border-radius:5px;object-fit:contain}
.item b{color:#0d685a;background:#e1f2e7;border-radius:5px;width:95%;text-align:center}
.selection h2{background:linear-gradient(90deg,#f8dbaa,#fff0ce);color:#145e50}
.selectionbox{border:3px dashed #1e9380;background:#fffdf6;align-content:flex-start;justify-content:flex-start;gap:4px}
.selected{position:relative;display:block;width:var(--tile-size,78px);height:calc(var(--tile-size,78px) * 1.03);padding:1px;border:1px solid #d3b889;border-radius:6px;background:#fff;flex:none}
.selected img{width:100%;height:100%;object-fit:contain;border-radius:4px}
.selected button{position:absolute;right:-2px;top:-2px;border:1px solid #c97777;background:#fff0ef;color:#9e3333;font-size:13px;padding:0;width:19px;height:19px;line-height:17px;border-radius:50%}
.actions .finish{background:#f2a657;color:#422b13}
.budgetline strong{color:#146e5d}
@media(max-width:750px){.selected{width:calc(var(--tile-size,78px)*.8);height:calc(var(--tile-size,78px)*.82)}header:before{display:none}}

.completedcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-height:47dvh;overflow:auto;padding:7px;background:#f8f3e8;border:2px dashed #188476;border-radius:10px}
.completedcard{background:white;border:1px solid #d7b78c;border-radius:8px;aspect-ratio:1/1.05;min-width:0;padding:3px}
.completedcard img{width:100%;height:100%;object-fit:contain}
#done{width:min(780px,94vw);max-height:92dvh;overflow:auto;background:#fffaf0;border:5px solid #197d6b}
#done h2{color:#116c5b;margin:7px 0}
#done .summary{max-height:16dvh;font-size:14px}
.item img{object-fit:contain;object-position:center}

.item img{height:100%;width:100%;object-fit:contain}
.item{padding:0;overflow:hidden}
.completedcards{display:grid;grid-template-columns:repeat(var(--complete-cols,5),minmax(0,1fr));grid-template-rows:repeat(var(--complete-rows,2),minmax(0,1fr));gap:4px;height:100%;max-height:none;overflow:hidden;padding:4px}
.completedcard{aspect-ratio:auto;height:100%;min-height:0;overflow:hidden;padding:1px}
.completedcard img{width:100%;height:100%;object-fit:contain}
#done{width:96vw;max-width:none;height:94dvh;max-height:94dvh;overflow:hidden;padding:10px;display:none;flex-direction:column;gap:4px}
#done[open]{display:flex}
#done h2{margin:0;font-size:clamp(16px,2vw,25px);flex:none}
#done .completedcards{flex:1;min-height:0}
#done .summary{max-height:11dvh;overflow:auto;flex:none;font-size:12px;display:flex;flex-wrap:wrap;gap:5px}
#done .summary p{margin:0 5px;border:0}
#done>p{margin:0;flex:none}
#done .close{padding:7px 24px}
