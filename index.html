<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いくらあるかな？</title><style>body{font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f6f7fb;color:#222}main{max-width:1050px;margin:auto;padding:15px}h1{text-align:center;font-size:clamp(24px,4vw,38px)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0}button,select,input{font-size:20px;padding:10px;border-radius:12px;border:2px solid #777;background:white}button{cursor:pointer}button:focus-visible,.coin:focus-visible{outline:4px solid #2475db}.bank{border:3px dashed #a2a2a2;border-radius:15px;min-height:105px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;background:white}.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:15px;border:2px solid #444}.lane{min-height:275px;border-right:2px solid #555;padding:8px;display:flex;align-items:center;flex-direction:column;gap:9px}.lane:last-child{border-right:0}.lane strong{font-size:clamp(15px,2.5vw,24px)}.lane[data-i="0"]{background:#e4ffc5}.lane[data-i="1"]{background:#fff3c4}.lane[data-i="2"]{background:#8cddf9}.lane[data-i="3"]{background:#ffdcdc}.slot{display:grid;grid-template-rows:repeat(5,42px);grid-auto-columns:minmax(38px,1fr);grid-auto-flow:column;align-content:start;justify-content:start;gap:4px;flex:1;width:100%;min-height:230px;overflow-x:auto;overflow-y:hidden}.coin{position:relative;overflow:hidden;width:clamp(58px,8.4vw,82px);height:clamp(58px,8.4vw,82px);border-radius:50%;border:4px solid #8a8a8a;box-shadow:inset 0 1px 1px #fff9,inset 0 -3px 6px #0003,1px 3px 4px #0002;background:#ddd;display:inline-flex;justify-content:center;align-items:center;touch-action:none;user-select:none;cursor:grab;padding:0}.coin::before{content:"";position:absolute;inset:6% 6%;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff88}.coin ass="digit-target" id="a3" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="1のへやの金額"><span class="yen-outside">円</span></div></div><section class="digit-bank" aria-label="数字カード"><h2>すうじカード</h2><div class="digits" id="digits"></div><p class="hint">すうじを きんがくの らんに はこぼう。カードを タップしてから らんを タップしても OK！</p></section><div id="result" class="result" aria-live="polite"></div><div class="controls"><button id="check">こたえを かくにん</button><button id="reset">もとにもどす</button><button id="next">つぎの もんだい</button></div></main><script>const bank=document.getElementById('bank'),slots=[...document.querySelectorAll('.slot')],target=document.getElementById('target'),level=document.getElementById('level'),result=document.getElementById('result');let selected=null,expected=0,seq=0;let isExchanging=false,exchangeGeneration=0;const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));const group=v=>v>=1000?0:v>=100?1:v>=10?2:3;

function coinsFor(n,l){

async function exchangePairs(){
  if(isExchanging)return;
  isExchanging=true;
  const generation=exchangeGeneration;
  const exchanges=[[500,1000],[50,100],[5,10]];
  try{
    for(const [oldValue,newValue] of exchanges){
      const source=slots[group(oldValue)];
      while(generation===exchangeGeneration){
        const pair=[...source.children].filter(c=>Number(c.dataset.v)===oldValue).slice(0,2);
        if(pair.length<2)break;
        // 2枚がそろった状態を見せ、ゆっくり光ってから交換する。
        pair.forEach(c=>c.classList.add('exchanging'));
        await pause(750);
        if(generation!==exchangeGeneration)return;
        const rects=pair.map(c=>c.getBoundingClientRect());
        const originX=(rects[0].left+rects[0].width/2+rects[1].left+rects[1].width/2)/2;
        const originY=(rects[0].top+rects[0].height/2+rects[1].top+rects[1].height/2)/2;
        // 元の2枚を消し、交換先の硬貨をいったん元の位置に大きく表示する。
        // 交換中は元の硬貨のマスを確保し、隣の硬貨を動かさない。
        pair.forEach(c=>{
          if(selected===c)selected=null;
          c.classList.remove('exchanging');
          c.style.visibility='hidden';
          c.style.pointerEvents='none';
        });
        const upgraded=document.createElement('button');
        upgraded.type='button';
        upgraded.className='coin arriving'+(newValue===1000?' bill':'');
        upgraded.dataset.v=String(newValue);
        renderMoneyFace(upgraded,newValue);
        upgraded.setAttribute('aria-label',newValue+'円');
        upgraded.draggable=true;
        upgraded.id='coin'+(++seq);
        upgraded.addEventListener('dragstart',e=>{if(isExchanging){e.preventDefault();return}selected=upgraded;e.dataTransfer.setData('text/plain',upgraded.id)});
        upgraded.addEventListener('click',()=>{if(isExchanging)return;if(selected===upgraded){selected.classList.remove('selected');selected=null}else{if(selected)selected.classList.remove('selected');selected=upgraded;upgraded.classList.add('selected')}});
        const destination=slots[group(newValue)];
        destination.append(upgraded);
        slots.forEach(arrange);
        const end=upgraded.getBoundingClientRect();
        upgraded.style.visibility='hidden';
        const size=newValue===1000?{width:105,height:64}:{width:62,height:62};
        // 画面に浮かべた交換後のお金を、移動せずその場で見せる。
        const flying=document.createElement('div');
        flying.className='exchange-flying';
        flying.style.width=size.width+'px';flying.style.height=size.height+'px';
        flying.style.left=(originX-size.width/2)+'px';
        flying.style.top=(originY-size.height/2)+'px';
        const face=document.createElement('div');
        face.className='coin'+(newValue===1000?' bill':'');
        face.dataset.v=String(newValue);
        renderMoneyFace(face,newValue);
        face.style.width='100%';face.style.height='100%';face.style.boxSizing='border-box';
        flying.append(face);document.body.append(flying);
        playTransformSound();
        await pause(1100);
        if(generation!==exchangeGeneration){flying.remove();return}
        // 変身したお金が見えている状態から、上の位の部屋へゆっくり移動。
        const deltaX=end.left+end.width/2-originX;
        const deltaY=end.top+end.height/2-originY;
        const shrink=Math.min(end.width/size.width,end.height/size.height);
        try{
          const motion=flying.animate([
            {transform:'translate(0,0) scale(1)',opacity:1},
            {transform:`translate(${deltaX}px,${deltaY}px) scale(${shrink})`,opacity:1}
          ],{duration:1350,easing:'ease-in-out',fill:'forwards'});
          await motion.finished.catch(()=>{});
        }finally{flying.remove()}
        if(generation!==exchangeGeneration)return;
        // 交換後のお金が着いてから、ほかの硬貨を整列させる。
        pair.forEach(c=>c.remove());
        arrange(source);
        upgraded.style.visibility='';
        upgraded.classList.remove('arriving');
        await pause(250);
      }
    }
  }finally{
    if(generation===exchangeGeneration)isExchanging=false;
  }
}
