/* トッピング画像が枠内に収まるようにする */
.option[data-group="toppings"] img{width:100%;height:clamp(70px,8vw,120px);object-fit:contain;object-position:center;display:block;padding:3px 5px;mix-blend-mode:normal}
.option[data-group="toppings"]{overflow:visible}
@media(max-width:800px){.option[data-group="toppings"] img{height:95px}}

/* 選んだ商品を一枚ずつカードで表示 */
.chosen-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;max-height:420px;overflow-y:auto;padding:3px;min-height:145px}
.chosen-card{position:relative;background:#fff;border:2px solid #e8c797;border-radius:12px;min-width:0;padding:9px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 3px #a87a4922}
.chosen-card img{height:73px;width:100%;object-fit:contain;display:block}
.chosen-card .chosen-name{font-size:12px;font-weight:800;text-align:center;line-height:1.25;overflow-wrap:anywhere;min-height:30px;display:flex;align-items:center;justify-content:center}
.chosen-card .chosen-price{font-size:19px;font-weight:900;color:#820b35}
.chosen-card .remove-card{position:absolute;right:3px;top:3px;border:0;border-radius:50%;width:32px;height:32px;background:#9d113d;color:white;font-size:23px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #5555}
.chosen-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-align:center;color:#85616b;font-weight:800;min-height:135px;background:#fff5e6;border-radius:12px}
@media(max-width:1100px){.chosen-cards{gap:5px}.chosen-card img{height:58px}.chosen-card .chosen-name{font-size:11px}.chosen-card .chosen-price{font-size:17px}}
@media(max-width:760px){.chosen-cards{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none}.chosen-card img{height:80px}}

/* iPadの画面に全商品と選択カードを収めるコンパクトレイアウト */
html,body{width:100%;height:100%;overflow:hidden}
.app{width:1280px;max-width:none;min-height:0;margin:0;padding:7px;transform-origin:top left}
.hero{height:90px}
.hero .budget{top:7px;padding:4px 13px;font-size:17px}
.body{grid-template-columns:minmax(0,1fr) 315px;gap:7px;margin-top:6px}
.step{grid-template-columns:105px minmax(0,1fr);gap:5px;margin-bottom:5px}
.step-title{font-size:16px;padding:3px;border-radius:10px;line-height:1.12}
.step-title .num{height:26px;width:26px;font-size:19px;margin-bottom:2px}
.step-title small{font-size:10px}
.option{padding:2px 1px 3px;border-radius:8px;box-shadow:none}
.option.selected{padding:0 0 1px}
.option img,.option[data-group="toppings"] img{height:65px;padding:0 2px;object-fit:contain}
.option .name{font-size:11px;line-height:1.12;min-height:2.25em}
.option .price{font-size:16px}
.options{gap:3px}
.sidebar{padding:6px;gap:5px;border-width:2px;border-radius:11px}
.sidebar h2{font-size:18px;padding:5px}
.chosen-cards{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none;overflow:visible;gap:4px;min-height:105px;padding:1px}
.chosen-card{padding:3px 1px 2px;gap:1px;border-width:1px;border-radius:7px;box-shadow:none}
.chosen-card img{height:38px}
.chosen-card .chosen-name{font-size:10px;min-height:22px;line-height:1.1}
.chosen-card .chosen-price{font-size:14px}
.chosen-card .remove-card{width:23px;height:23px;font-size:17px;right:1px;top:1px}
.chosen-empty{min-height:80px}
.total{padding:5px}.total strong{font-size:24px}
.meter{height:15px}.meter-labels{font-size:12px}
.balance{padding:5px;font-size:15px}
.primary{padding:9px 5px;font-size:16px}
.secondary{padding:6px;font-size:13px}
.help{font-size:10px;line-height:1.2}
@media(max-width:760px){.body{display:grid;grid-template-columns:minmax(0,1fr) 315px}.step{grid-template-columns:105px minmax(0,1fr)}.options.c9{grid-template-columns:repeat(9,minmax(0,1fr))}.options.c8{grid-template-columns:repeat(8,minmax(0,1fr))}.options.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.option img,.option[data-group="toppings"] img{height:65px}.option .name{font-size:11px}.option .price{font-size:16px}.sidebar{margin-top:0}.chosen-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

ta={"containers": [["cup", "紙カップ", 0], ["cone", "ワッフルコーン", 50], ["choccone", "チョコワッフルコーン", 100], ["bowl", "ワッフルの器", 150]], "flavors": [["vanilla", "バニラ", 200], ["chocolate", "チョコレート", 200], ["strawberry", "ストロベリー", 200], ["matcha", "まっちゃ", 200], ["cookies", "クッキー＆クリーム", 200], ["mango", "マンゴー", 200], ["ramune", "ラムネ", 200], ["mint", "ミントチョコチップ", 200], ["purple", "むらさきいも", 200]], "toppings": [["cream", "ホイップクリーム", 100], ["berry", "いちご（スライス3枚）", 100], ["banana", "バナナ", 100], ["mangotop", "マンゴー", 100], ["pineapple", "パイナップル", 100], ["cookie", "クッキー", 50], ["brownie", "ブラウニー", 100], ["pocky", "ポッキー", 50]], "sauces": [["none", "なし", 0], ["chocsauce", "チョコソース", 50], ["berrysauce", "ストロベリーソース", 50], ["caramel", "キャラメルソース", 50]]};let state={container:null,flavors:[],toppings:[],sauces:[]};const BUDGET=1000;const fmt=n=>n.toLocaleString('ja-JP')+'円';const lookup=id=>Object.values(data).flat().find(x=>x[0]===id);const val=id=>id?lookup(id)[2]:0;function total(){return val(state.container)+state.flavors.reduce((s,x)=>s+val(x),0)+state.toppings.reduce((s,x)=>s+val(x),0)+state.sauces.reduce((s,x)=>s+val(x),0)}
function select(group,id){if(group==='containers')state.container=state.container===id?null:id;else if(group==='sauces'){if(id==='none')state.sauces=[];else{let i=state.sauces.indexOf(id);if(i>=0)state.sauces.splice(i,1);else state.sauces.push(id)}}else if(group==='flavors'){let count=state.flavors.filter(x=>x===id).length;if(state.flavors.length<3)state.flavors.push(id);else if(count)state.flavors.splice(state.flavors.indexOf(id),1);else {announce('アイスは 3こまでだよ');return}}else{let i=state.toppings.indexOf(id);if(i>=0)state.toppings.splice(i,1);else state.toppings.push(id)}render()}
function announce(s){let b=document.getElementById('balance');b.textContent=s;setTimeout(update,1300)}
const sections=[['containers','入れ物を\nえらぶ','',4],['flavors','アイスを\nえらぶ','1スクープ 200円（1〜3スクープ）',9],['toppings','トッピングを\nえらぶ','いくつでも',8],['sauces','ソースを\nえらぶ','いくつでも・なしもOK',4]];
function render(){document.getElementById('steps').innerHTML=sections.map(([key,title,subtitle,cols],i)=>`<section class="step"><div class="step-title"><span class="num">${i+1}</span>${title.replace('\n','<br>')}<small>${subtitle}</small></div><div class="options c${cols}">${data[key].map(([id,name,price])=>{let q=key==='flavors'?state.flavors.filter(x=>x===id).length:key==='toppings'?Number(state.toppings.includes(id)):key==='sauces'?Number(id==='none'?state.sauces.length===0:state.sauces.includes(id)):Number(state.container===id);return `<button type="button" class="option ${q?'selected':''}" data-group="${key}" data-id="${id}" aria-label="${name} ${price}円"><img src="${assets[id]}" alt=""><span class="name">${name}</span><span class="price">${fmt(price)}</span>${q?`<span class="qty">${key==='flavors'?q+'こ':'✓'}</span>`:''}</button>`}).join('')}</div></section>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>select(b.dataset.group,b.dataset.id));update()}
function removeChosen(group,id){
 if(group==='containers'){state.container=null}
 else if(group==='sauces'){state.sauces=state.sauces.filter(x=>x!==id)}
 else if(group==='flavors'){const i=state.flavors.indexOf(id);if(i>=0)state.flavors.splice(i,1)}
 else if(group==='toppings'){const i=state.toppings.indexOf(id);if(i>=0)state.toppings.splice(i,1)}
 render();
}
function chosenItems(){
 const items=[];
 if(state.container)items.push(['containers',state.container]);
 state.flavors.forEach(id=>items.push(['flavors',id]));
 state.toppings.forEach(id=>items.push(['toppings',id]));
 state.sauces.forEach(id=>items.push(['sauces',id]));
 return items;
}
function renderChosenCards(){
 const items=chosenItems();
 const area=document.getElementById('chosenCards');
 if(!items.length){area.innerHTML='<div class="chosen-empty">しょうひんを えらんでね！</div>';return}
 area.innerHTML=items.map(([group,id],i)=>{const item=lookup(id);return `<div class="chosen-card"><img src="${assets[id]}" alt=""><div class="chosen-name">${item[1]}</div><div class="chosen-price">${fmt(item[2])}</div><button type="button" class="remove-card" data-index="${i}" aria-label="${item[1]}を ひとつ とりけす">×</button></div>`}).join('');
 area.querySelectorAll('.remove-card').forEach(b=>b.addEventListener('click',()=>{const [group,id]=items[Number(b.dataset.index)];removeChosen(group,id)}));
}
function dessert(){let base={cup:'🥤',cone:'🍦',choccone:'🍦',bowl:'🧇'}[state.container]||'🍨';let flavors=state.flavors.map(x=>`<img class="scoop" src="${assets[x]}" alt="">`).join('');let extras=state.toppings.map(x=>`<img src="${assets[x]}" alt="">`).join('');return `<div class="dessert"><div class="base">${base}</div><div class="scoops">${flavors}</div><div class="extras">${extras}</div></div><div class="hint">${state.flavors.length?'すきなアイスが できてきたよ！':'アイスを えらんでね！'}</div>`}
let previousTotal=0;
function playBuzzer(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const start=a.currentTime;[0,.23].forEach(offset=>{const osc=a.createOscillator(),gain=a.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(260,start+offset);osc.frequency.linearRampToValueAtTime(170,start+offset+.19);gain.gain.setValueAtTime(.0001,start+offset);gain.gain.linearRampToValueAtTime(.13,start+offset+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+offset+.20);osc.connect(gain);gain.connect(a.destination);osc.start(start+offset);osc.stop(start+offset+.21)});setTimeout(()=>a.close(),900)}catch(e){}}
function playPerfect(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[659,784,1047,1319].forEach((freq,i)=>{const osc=a.createOscillator(),gain=a.createGain(),start=a.currentTime+i*.105;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.15,start+.018);gain.gain.exponentialRampToValueAtTime(.0001,start+.29);osc.connect(gain);gain.connect(a.destination);osc.start(start);osc.stop(start+.30)});setTimeout(()=>a.close(),1100)}catch(e){}
try{if('speechSynthesis' in window){window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance('ぴったり！');utterance.lang='ja-JP';utterance.pitch=1.65;utterance.rate=1.05;utterance.volume=1;const voices=window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ja'));if(voices.length)utterance.voice=voices.find(v=>/female|kyoko|haruka|nanami|siri/i.test(v.name))||voices[0];window.speechSynthesis.speak(utterance)}}catch(e){}}
function update(){let t=total();if(previousTotal<=BUDGET&&t>BUDGET)playBuzzer();else if(previousTotal!==BUDGET&&t===BUDGET)playPerfect();previousTotal=t;renderChosenCards();document.getElementById('total').textContent=fmt(t);document.getElementById('fill').style.width=Math.min(t/BUDGET*100,100)+'%';document.getElementById('fill').style.background=t>BUDGET?'#e53935':'linear-gradient(90deg,#ff94b3,#d90c55)';let b=document.getElementById('balance');b.classList.toggle('over',t>BUDGET);b.textContent=t>BUDGET?`${fmt(t-BUDGET)} オーバー！ えらびなおそう`:t===BUDGET?"🎉 ぴったり！ 🎉":`あと ${fmt(BUDGET-t)} かえます`;document.getElementById('finish').disabled=!state.container||!state.flavors.length||t>BUDGET}
function fanfare(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047,784,1047].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(a.destination);let t=a.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27)})}catch(e){}}
document.getElementById('finish').onclick=()=>{document.getElementById('finalpreview').innerHTML=chosenItems().map(([group,id])=>{const item=lookup(id);return `<div class="final-card"><img src="${assets[id]}" alt=""><span>${item[1]}</span><strong>${fmt(item[2])}</strong></div>`}).join('');let labels=state.flavors.map(x=>lookup(x)[1]).join('・');document.getElementById('summary').textContent=`${lookup(state.container)[1]} ／ ${labels} ／ ${state.toppings.map(x=>lookup(x)[1]).join('・')||'トッピングなし'} ／ ${state.sauces.length?state.sauces.map(x=>lookup(x)[1]).join('・'):'ソースなし'}`;document.getElementById('finalsum').textContent=`ごうけい ${fmt(total())}`;document.getElementById('overlay').classList.add('show');fanfare()};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('show');document.getElementById('reset').onclick=()=>{state={container:null,flavors:[],toppings:[],sauces:[]};render()};document.getElementById('print').onclick=()=>{document.getElementById('printarea').innerHTML='<h1>Aloha Ice Cream Café　きりとりカード</h1>'+sections.map(([key,title])=>`<h2>${title.replace('\n',' ')}</h2><div class="print-grid">${data[key].map(([id,name,price])=>`<div class="print-card"><img src="${assets[id]}"><div>${name}　${fmt(price)}</div></div>`).join('')}</div>`).join('');window.print()};render();

// 全体を画面内に自動フィット。商品カード追加・削除時にも再計算。
function fitWholeScreen(){
 const app=document.querySelector('.app');
 if(!app)return;
 app.style.transform='none';
 const contentHeight=app.scrollHeight;
 const w=window.innerWidth,h=window.innerHeight;
 const scale=Math.min(w/1280,h/contentHeight);
 app.style.transform=`scale(${scale})`;
 document.body.style.height=h+'px';
}
window.addEventListener('resize',fitWholeScreen);
window.addEventListener('orientationchange',()=>requestAnimationFrame(fitWholeScreen));
const fitObserver=new MutationObserver(()=>requestAnimationFrame(fitWholeScreen));
fitObserver.observe(document.querySelector('.app'),{childList:true,subtree:true,characterData:true});
window.addEventListener('load',fitWholeScreen);
requestAnimationFrame(fitWholeScreen);
</script></body></html>
